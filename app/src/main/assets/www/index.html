<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لايف للتعدين — اطلب منتجاتك</title>
<meta name="description" content="كتالوج منتجات لايف للتعدين وطلبها مباشرة عبر واتساب">
<meta name="theme-color" content="#0f1c2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لايف للتعدين">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1c2e;--navy2:#1b2d47;--gold:#b98a3e;--gold-d:#8f6724;--bg:#f5f3ee;--card:#fff;--ink:#17202d;--mut:#667085;--line:#e4dfd3;--ok:#1f8a4c;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,textarea{font-family:inherit;font-size:16px}
.top{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:46px;height:50px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;flex:none}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:19px;font-weight:800;line-height:1.2}.brand span{font-size:12px;letter-spacing:2px;color:#d9c08a}
.call{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--gold);color:#fff;text-decoration:none;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.hero{margin:14px 0 6px;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;border-radius:var(--r);padding:16px 16px 14px}
.hero h1{margin:0 0 4px;font-size:20px;font-weight:800}.hero p{margin:0;color:#d5dbe6;font-size:14.5px}
.search{position:relative;margin:12px 0 8px}
.search input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:0 44px 0 14px;background:#fff;color:var(--ink)}
.search svg{position:absolute;right:14px;top:14px;width:20px;height:20px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:center}
.ico{flex:none;width:58px;height:58px;border-radius:12px;background:#efe9da;color:var(--gold-d);display:flex;align-items:center;justify-content:center}
.ico svg{width:32px;height:32px}
.info{flex:1;min-width:0}.info h3{margin:0;font-size:16px;font-weight:700;line-height:1.35}
.meta{margin-top:2px;font-size:13px;color:var(--mut)}.price{color:var(--navy);font-weight:700;font-size:14px;margin-top:2px}
.add{flex:none;min-height:44px;min-width:92px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;padding:0 14px}
.add:active{transform:scale(.97)}
.step{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.step button{width:44px;height:44px;border:0;background:#f4f1e8;font-size:22px;font-weight:700;color:var(--navy);cursor:pointer}
.step span{min-width:36px;text-align:center;font-weight:800}
.empty{padding:36px 12px;text-align:center;color:var(--mut)}
.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{display:flex;width:100%;max-width:760px;margin:0 auto;min-height:56px;align-items:center;justify-content:space-between;padding:0 18px;border:0;border-radius:16px;background:var(--gold);color:#fff;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(15,28,46,.25);cursor:pointer}
.bar[hidden]{display:none}.badge{background:#fff;color:var(--gold-d);border-radius:999px;min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;padding:0 8px}
.ov{position:fixed;inset:0;background:rgba(15,28,46,.55);z-index:40;display:none}.ov.on{display:block}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:50;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-width:760px;margin:0 auto}
.sheet.on{transform:none}
.sheet h2{margin:0 0 10px;font-size:19px}
.close{position:absolute;left:12px;top:12px;width:44px;height:44px;border:0;background:#f4f1e8;border-radius:12px;font-size:22px;cursor:pointer}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.line .n{flex:1;font-weight:500}
.rm{border:0;background:none;color:#b42318;font-weight:700;min-height:44px;padding:0 6px;cursor:pointer}
label{display:block;margin:12px 0 4px;font-weight:700;font-size:14px}
.f{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink)}
textarea.f{min-height:80px;resize:vertical}
.send{margin-top:16px;width:100%;min-height:54px;border:0;border-radius:14px;background:var(--ok);color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.sec{margin-top:10px;width:100%;min-height:48px;border-radius:14px;border:1px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center}
.err{color:#b42318;font-size:14px;margin-top:6px;min-height:20px}
.foot{margin:22px 0 8px;padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);font-size:14px;color:var(--mut)}
.foot b{color:var(--ink)}.foot a{color:var(--navy);font-weight:700}
.inst{margin-top:10px;width:100%;min-height:46px;border:1px dashed var(--gold);background:#fffaf0;border-radius:12px;color:var(--gold-d);font-weight:700;cursor:pointer}
.toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom));margin:auto;max-width:360px;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;text-align:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <img class="logo" src="icons/logo.png" alt="شعار لايف للتعدين">
  <div class="brand"><b>لايف للتعدين</b><span>LIFE MINING</span></div>
  <a class="call" id="callTop" href="#" aria-label="اتصال">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>اتصال</a>
</div></header>

<main class="wrap">
  <section class="hero"><h1>اطلب منتجاتك مباشرة</h1><p>اختر المنتجات وأرسل طلبك على واتساب، ونرد عليك بالسعر والتوفر.</p></section>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث عن منتج…" aria-label="بحث عن منتج" autocomplete="off"></div>
  <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>لا توجد منتجات مطابقة. جرّب كلمة أخرى أو <a id="askLink" href="#">اسألنا عبر واتساب</a>.</div>
  <section class="foot" id="foot"></section>
</main>

<div class="bar" id="bar" hidden><button id="openCart" type="button"><span>مراجعة الطلب وإرساله</span><span class="badge" id="cnt">0</span></button></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="طلبك">
  <button class="close" id="closeCart" type="button" aria-label="إغلاق">×</button>
  <h2>طلبك</h2>
  <div id="lines"></div>
  <label for="cName">الاسم *</label><input class="f" id="cName" autocomplete="name">
  <label for="cPhone">رقم الهاتف</label><input class="f" id="cPhone" type="tel" inputmode="tel" autocomplete="tel">
  <label for="cCity">المدينة / المنطقة</label><input class="f" id="cCity" autocomplete="address-level2">
  <label for="cNote">ملاحظات</label><textarea class="f" id="cNote"></textarea>
  <div class="err" id="err" role="alert"></div>
  <button class="send" id="send" type="button">إرسال الطلب عبر واتساب</button>
  <a class="sec" id="callSheet" href="#">أو اتصل بنا</a>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="products.js"></script>
<script>
(function(){
var C=window.APP_CONFIG,P=window.PRODUCTS,CATS=window.CATEGORIES;
var $=function(i){return document.getElementById(i)};
var cart={},cat='all',query='';
try{var s=JSON.parse(localStorage.getItem('lm_cart')||'{}');if(s&&typeof s==='object')cart=s;}catch(e){}
function save(){try{localStorage.setItem('lm_cart',JSON.stringify(cart));}catch(e){}}
var ICONS={
 devices:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>',
 ballmill:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.6"/><circle cx="14.5" cy="9" r="1.2"/><circle cx="13" cy="14.5" r="1.8"/><circle cx="8.5" cy="14.5" r="1"/></svg>',
 mesh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>',
 coal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 15 9 5l6 3 5 7-4 4H8z"/><path d="M9 5l1 6 5-3M10 11l-2 8M10 11l6 8"/></svg>',
 electric:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>'
};
function fmt(n){return Number(n).toLocaleString('en-US');}
function tel(){return 'tel:'+C.phoneIntl;}
function wa(text){return 'https://wa.me/'+C.whatsapp+(text?'?text='+encodeURIComponent(text):'');}
function count(){var n=0;for(var k in cart)n+=cart[k];return n;}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('on');},1800);}
function norm(s){return String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase();}

function renderChips(){
  var h='<button class="chip" type="button" data-c="all" aria-pressed="'+(cat==='all')+'">الكل</button>';
  CATS.forEach(function(c){h+='<button class="chip" type="button" data-c="'+c.id+'" aria-pressed="'+(cat===c.id)+'">'+c.name+'</button>';});
  $('chips').innerHTML=h;
}
function renderGrid(){
  var q=norm(query),list=P.filter(function(p){return !p.hidden&&(cat==='all'||p.cat===cat)&&(!q||norm(p.name+' '+(p.note||'')).indexOf(q)>-1);});
  var h='';
  list.forEach(function(p){
    var n=cart[p.id]||0,price=(C.showPrices&&p.price)?'<div class="price">'+fmt(p.price)+' '+C.currency+'</div>':'';
    var meta=[p.unit?('الوحدة: '+p.unit):'',p.note||''].filter(Boolean).join(' — ');
    h+='<article class="card"><div class="ico" aria-hidden="true">'+ICONS[p.cat]+'</div><div class="info"><h3>'+p.name+'</h3>'+(meta?'<div class="meta">'+meta+'</div>':'')+price+'</div>'+
      (n?'<div class="step"><button type="button" data-a="inc" data-id="'+p.id+'" aria-label="زيادة">+</button><span>'+n+'</span><button type="button" data-a="dec" data-id="'+p.id+'" aria-label="إنقاص">−</button></div>'
        :'<button class="add" type="button" data-a="add" data-id="'+p.id+'">أضف للطلب</button>')+'</article>';
  });
  $('grid').innerHTML=h;$('empty').hidden=list.length>0;
}
function renderBar(){var n=count();$('bar').hidden=n===0;$('cnt').textContent=n;}
function renderCart(){
  var h='';
  P.forEach(function(p){var n=cart[p.id];if(!n)return;
    h+='<div class="line"><div class="n">'+p.name+'</div><div class="step"><button type="button" data-a="inc" data-id="'+p.id+'" aria-label="زيادة">+</button><span>'+n+'</span><button type="button" data-a="dec" data-id="'+p.id+'" aria-label="إنقاص">−</button></div><button class="rm" type="button" data-a="rm" data-id="'+p.id+'">حذف</button></div>';});
  $('lines').innerHTML=h||'<div class="empty">الطلب فارغ</div>';
}
function refresh(){renderGrid();renderBar();renderCart();save();}
function act(a,id){
  if(a==='add'||a==='inc')cart[id]=(cart[id]||0)+1;
  else if(a==='dec'){cart[id]=(cart[id]||0)-1;if(cart[id]<=0)delete cart[id];}
  else if(a==='rm')delete cart[id];
  refresh();if(count()===0)closeCart();
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(b){act(b.dataset.a,b.dataset.id);return;}
  var c=e.target.closest('.chip');if(c){cat=c.dataset.c;renderChips();renderGrid();}
});
$('q').addEventListener('input',function(e){query=e.target.value;renderGrid();});
function openCart(){renderCart();$('ov').classList.add('on');$('sheet').classList.add('on');$('err').textContent='';}
function closeCart(){$('ov').classList.remove('on');$('sheet').classList.remove('on');}
$('openCart').onclick=openCart;$('closeCart').onclick=closeCart;$('ov').onclick=closeCart;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCart();});
$('cName').addEventListener('input',function(){$('err').textContent='';});
['cName','cPhone','cCity','cNote'].forEach(function(i){try{var v=localStorage.getItem('lm_'+i);if(v)$(i).value=v;}catch(e){}$(i).addEventListener('input',function(){try{localStorage.setItem('lm_'+i,$(i).value);}catch(e){}});});

window.buildMessage=function(){
  var L=['السلام عليكم، أرغب في طلب المنتجات التالية من '+C.name+':',''],i=0;
  P.forEach(function(p){var n=cart[p.id];if(!n)return;i++;L.push(i+') '+p.name+' — الكمية: '+n+(p.unit?' '+p.unit:''));});
  L.push('');L.push('الاسم: '+$('cName').value.trim());
  var ph=$('cPhone').value.trim(),ct=$('cCity').value.trim(),nt=$('cNote').value.trim();
  if(ph)L.push('الهاتف: '+ph);if(ct)L.push('المنطقة: '+ct);if(nt)L.push('ملاحظات: '+nt);
  return L.join('\n');
};
$('send').onclick=function(){
  if(count()===0){$('err').textContent='أضف منتجاً واحداً على الأقل.';return;}
  if(!$('cName').value.trim()){$('err').textContent='اكتب اسمك من فضلك.';$('cName').focus();return;}
  $('err').textContent='';
  window.location.href=wa(window.buildMessage());
};
$('callTop').href=tel();$('callSheet').href=tel();$('askLink').href=wa('السلام عليكم، أرغب في الاستفسار عن منتج: '+query);

var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
var foot='<b>للطلب والاستفسار</b><br>واتساب واتصال: <a href="'+tel()+'" dir="ltr">'+C.phoneLocal+'</a><br>'+C.name+' — '+C.nameEn;
if(!standalone&&ios)foot+='<br><br>لتثبيت التطبيق على الآيفون: اضغط زر المشاركة في Safari ثم «إضافة إلى الشاشة الرئيسية».';
$('foot').innerHTML=foot+'<div id="instBox"></div>';
var dp=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;$('instBox').innerHTML='<button class="inst" id="inst" type="button">تثبيت التطبيق على هاتفك</button>';$('inst').onclick=function(){dp.prompt();dp=null;$('instBox').innerHTML='';};});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}

/* مزامنة الأسعار من Google Sheet (CSV منشور). الأعمدة: id | name | price | available */
function parseCSV(t){var r=[],row=[],f='',q=false,i,c;t=t.replace(/^﻿/,'');
 for(i=0;i<t.length;i++){c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;else if(c===','){row.push(f);f='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.join('')!=='')r.push(row);row=[];}
  else f+=c;}
 if(f!==''||row.length){row.push(f);r.push(row);}return r;}
function digits(s){return String(s).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632;}).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776;});}
function applySheet(csv){
 var rows=parseCSV(csv);if(rows.length<2)return false;
 var h=rows[0].map(function(x){return x.trim().toLowerCase();}),ii=h.indexOf('id'),ip=h.indexOf('price'),ia=h.indexOf('available');
 if(ii<0||ip<0)return false;
 var map={};P.forEach(function(p){map[p.id]=p;});
 for(var k=1;k<rows.length;k++){var r=rows[k],p=map[(r[ii]||'').trim()];if(!p)continue;
  var v=parseFloat(digits(r[ip]||'').replace(/[,\s]/g,''));p.price=(isFinite(v)&&v>0)?v:null;
  if(ia>-1){var a=norm(r[ia]||'').trim();p.hidden=(a==='لا'||a==='no'||a==='0'||a==='false');}}
 return true;}
window.__cbs={};
window.__nativeFetchDone=function(id,t){var c=window.__cbs[id];if(!c)return;delete window.__cbs[id];t==null?c.rej(new Error('fail')):c.res(t);};
function getText(url){
 if(window.AndroidBridge&&window.AndroidBridge.fetchText)return new Promise(function(res,rej){
  var id='f'+Date.now()+Math.random().toString(36).slice(2);window.__cbs[id]={res:res,rej:rej};window.AndroidBridge.fetchText(url,id);
  setTimeout(function(){if(window.__cbs[id]){delete window.__cbs[id];rej(new Error('timeout'));}},20000);});
 return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();});}
function sheetUrl(){
 if(C.sheetCsvUrl)return C.sheetCsvUrl;
 var m=(C.sheetUrl||'').match(/\/d\/([a-zA-Z0-9_-]{20,})/);if(!m)return '';
 return 'https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv&headers=1'+(C.sheetName?'&sheet='+encodeURIComponent(C.sheetName):'')+'&t='+Date.now();}
function syncSheet(){
 var u=sheetUrl();if(!u)return;
 try{var c=localStorage.getItem('lm_sheet');if(c&&applySheet(c))refresh();}catch(e){}
 getText(u).then(function(t){if(/^\s*</.test(t))return;
  if(applySheet(t)){try{localStorage.setItem('lm_sheet',t);}catch(e){}refresh();}}).catch(function(){});}
renderChips();refresh();syncSheet();
})();
</script>
</body>
</html>
